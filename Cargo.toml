[package]
name = "agentmon"
version = "0.1.0"
edition = "2021"
description = "agentMon: a hive-themed desktop widget that monitors Claude Code sessions across projects"
publish = false

[dependencies]
tao = "=0.37.3"
wry = "=0.57.3"
serde_json = "=1.0.154"
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tiny-skia = "=0.12.0"
winresource = "=0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
