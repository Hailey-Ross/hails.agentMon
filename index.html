<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agentMon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3l25 14.5v29L32 61 7 46.5v-29z' fill='%23f5b83d'/%3E%3Cellipse cx='32' cy='35' rx='12' ry='9' fill='%232b1a00'/%3E%3Cpath d='M26 27v16M33 26v18' stroke='%23f5b83d' stroke-width='4'/%3E%3C/svg%3E">
<script>
  // Theme before first paint: auto follows the system; the choice is remembered.
  (function () {
    var t = localStorage.getItem('am-theme') || 'auto';
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="board.css">
</head>
<body>
<div class="ambient"><svg id="comb" aria-hidden="true"></svg><i></i><i></i></div>

<nav class="rail" aria-label="Views">
  <a class="brand" href="#home" title="agentMon">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="lgHoney" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#e09a12"/></linearGradient></defs>
      <path d="M32 3l25 14.5v29L32 61 7 46.5v-29z" fill="url(#lgHoney)"/>
      <path d="M32 11l18 10.5v21L32 53 14 42.5v-21z" fill="none" stroke="#2b1a00" stroke-opacity=".25" stroke-width="2"/>
      <ellipse cx="25" cy="25" rx="6" ry="8" fill="#fff" fill-opacity=".85" transform="rotate(-25 25 25)"/>
      <ellipse cx="35" cy="24" rx="6" ry="8" fill="#fff" fill-opacity=".85" transform="rotate(20 35 24)"/>
      <ellipse cx="31" cy="37" rx="12" ry="9" fill="#2b1a00"/>
      <path d="M26 29.5v15M33 28.5v17" stroke="#ffc94a" stroke-width="3.5"/>
      <circle cx="43" cy="35" r="4.5" fill="#2b1a00"/>
    </svg>
    <span class="wm">agentMon</span>
  </a>
  <div class="nav">
    <span class="nav-glow" id="nav-glow"></span>
    <a class="item" data-view="home" href="#home"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><path d="M9.5 21v-5.5h5V21"/></svg>Hive</a>
    <a class="item" data-view="sessions" href="#sessions"><svg class="ic" viewBox="0 0 24 24"><ellipse cx="11" cy="14" rx="6" ry="4.5"/><path d="M8.5 10v8M12 9.6v8.8"/><circle cx="18" cy="13" r="2"/><path d="M9 9.5C7 6 8 3.5 10 4s1.5 3 .5 5.5M13 9.5c1-3 3-4.5 4.5-3.5s0 3-2.5 4"/></svg>Sessions<span class="badge" id="c-sessions" hidden></span></a>
    <a class="item" data-view="projects" href="#projects"><svg class="ic" viewBox="0 0 24 24"><path d="M8 3l4 2.3v4.6L8 12.2 4 9.9V5.3zM16 3l4 2.3v4.6l-4 2.3-4-2.3V5.3zM12 11.8l4 2.3v4.6L12 21l-4-2.3v-4.6z"/></svg>Projects</a>
    <a class="item" data-view="prs" href="#prs"><svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4M13 4.5L10.5 7 13 9.5"/></svg>PRs<span class="badge bad" id="c-prs" hidden></span></a>
    <a class="item" data-view="queue" href="#queue"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M18 9v9M15.5 15.5 18 18l2.5-2.5"/></svg>Queue<span class="badge" id="c-queue" hidden></span></a>
  </div>
  <button class="rail-foot" id="theme" title="Theme"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</nav>

<header class="topbar" id="topbar">
  <span class="app-only app-name"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3l25 14.5v29L32 61 7 46.5v-29z" fill="#f5b83d"/><ellipse cx="31" cy="37" rx="12" ry="9" fill="#2b1a00"/><path d="M26 29.5v15M33 28.5v17" stroke="#ffc94a" stroke-width="3.5"/></svg>agentMon</span>
  <span class="clock" id="clock"></span>
  <span class="spacer"></span>
  <button class="chip" id="fresh" title="Refresh now"><span class="beat"></span><span>loading</span></button>
  <span class="app-only win-ctl">
    <button id="w-pin" title="Keep on top"><svg class="ic" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 3v2H6v-2l4-3zM12 14v7"/></svg></button>
    <button id="w-min" title="Minimize"><svg class="ic" viewBox="0 0 24 24"><path d="M6 13h12"/></svg></button>
    <button id="w-close" class="close" title="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </span>
</header>
<div class="app-only grip" id="grip" title="Resize"></div>
<div class="app-only edges" id="edges" aria-hidden="true"><i data-d="n"></i><i data-d="s"></i><i data-d="e"></i><i data-d="w"></i><i data-d="ne"></i><i data-d="nw"></i><i data-d="se"></i><i data-d="sw"></i></div>

<main class="frame"><div class="page" id="view"></div></main>

<script src="board.js"></script>
</body>
</html>
